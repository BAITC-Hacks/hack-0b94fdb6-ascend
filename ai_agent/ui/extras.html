<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дополнительный анализ</title>
<style>body{font:16px system-ui;background:#f1f6f8;color:#183944;margin:0}main{max-width:1150px;margin:auto;padding:28px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,input{font:inherit;padding:10px;border:1px solid #abc5cf;border-radius:7px}button{background:white;cursor:pointer}button.active{background:#147e71;color:white}section{background:white;padding:22px;border-radius:14px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{max-width:300px;overflow-wrap:anywhere;padding:9px;border-bottom:1px solid #dde8eb;text-align:left;vertical-align:top}pre{white-space:pre-wrap;font-size:13px}svg{width:100%;height:270px}.muted{color:#607984}a{color:#087567}#error{color:#a44121}</style>
<main><h1>Дополнительный анализ графа</h1><p class="muted">Результаты готового снимка. Структурные связи и временное совпадение — основания для проверки, а не доказательство движения одних и тех же денег.</p><a href="/assistant">Помощник</a> · <a href="/">Основной сайт</a><nav id="tabs"></nav><section><div id="error" role="status"></div><div id="content"></div></section></main>
<script>
const content=document.querySelector('#content'),error=document.querySelector('#error');
async function api(path){const r=await fetch('/api/v1/'+path);const d=await r.json();if(!r.ok)throw Error(d.error?.message||'Ошибка запроса');return d;}
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
const labels={date:'Дата',n_tx:'Транзакций',sum_kzt:'Сумма, ₸',n_active_nodes:'Активных узлов',is_spike:'Всплеск',strategy:'Стратегия',n_removed:'Удалено узлов',n_components:'Компонент со связями',largest_component:'Крупнейшая компонента',largest_share:'Доля узлов в ней',seed_pairs_retained:'Сохранённые пути от seed, доля',flow_retained:'Сохранённый оборот, доля',importance:'Важность',n_nodes:'Узлов',gids:'GID',reason:'Основание',suggested_request:'Что запросить',profile_bucket:'Корзина',n_reference:'Наблюдений',n_onward:'Передают дальше',p_onward:'Эмпирическая доля передачи',boundary_share:'Доля граничных узлов',boundary_flow_share:'Доля оборота на границу',observed_sink_flow_share:'Доля оборота в наблюдаемые стоки',seed_without_out:'Seed без исходящих',isolated:'Изоляты',small_tx_share:'Доля небольших переводов',description:'Описание',event_type:'Событие',n_counterparties:'Контрагентов',counterparties:'GID контрагентов',anomaly_type:'Признак',feature:'Показатель',value:'Значение',reference:'Сравнение',ratio:'Отношение',counterparty_gid:'GID контрагента'};
function table(rows){if(!rows?.length){content.append(el('p','Нет результатов в этом снимке.'));return;}const t=el('table'),head=el('tr');const keys=Object.keys(rows[0]);keys.forEach(k=>head.append(el('th',labels[k]||k)));t.append(head);for(const row of rows){const tr=el('tr');for(const k of keys){const td=el('td',typeof row[k]==='boolean'?(row[k]?'Да':'Нет'):typeof row[k]==='object'?JSON.stringify(row[k]):row[k]);tr.append(td);}t.append(tr);}content.append(t);}
function chart(series,ykey){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1000 270');svg.setAttribute('role','img');svg.setAttribute('aria-label',ykey);const all=Object.values(series).flat(),max=Math.max(1,...all.map(x=>x[ykey]));const maxx=Math.max(1,...all.map(x=>x.x));Object.entries(series).forEach(([name,rows],i)=>{const color=['#137f71','#db8139','#7566b3'][i%3],line=document.createElementNS(ns,'polyline');line.setAttribute('points',rows.map(r=>(45+900*r.x/maxx)+','+(220-180*r[ykey]/max)).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke',color);line.setAttribute('stroke-width','3');svg.append(line);const label=document.createElementNS(ns,'text');label.setAttribute('x',45+i*250);label.setAttribute('y',250);label.setAttribute('fill',color);label.textContent=({priority:'По приоритету',degree:'По числу связей',random:'Случайно'})[name]||name;svg.append(label);});content.append(svg);content.append(el('p','Вертикальная шкала: 0–'+max+'. Горизонтальная: 0–'+maxx+'. Точные значения — в таблице.'));}
const screens={
'Время':async()=>{const d=await api('temporal/daily');if(!d.available)content.append(el('p','Временной анализ ещё не рассчитан.'));chart({'Оборот, ₸':d.items.map((x,i)=>({...x,x:i+1}))},'sum_kzt');const date=el('input');date.type='date';date.min='2026-07-01';date.max='2026-07-31';date.value='2026-07-14';const b=el('button','События дня');b.onclick=async()=>{const events=await api('temporal/events?date='+date.value);content.replaceChildren(el('h2','События '+date.value));table(events.items);};content.append(date,b);table(d.items);},
'Устойчивость':async()=>{const d=await api('resilience'),series={};for(const r of d.items){(series[r.strategy]??=[]).push({...r,x:r.n_removed});}chart(series,'seed_pairs_retained');content.append(el('p','Доля сохранившихся достижимых пар seed → узел. Приоритет сравнивается со степенью и случайным удалением.'));table(d.items);content.append(el('h2','Удалённые узлы'));table(d.removed);},
'Белые пятна':async()=>{const d=await api('gaps'),c=await api('coverage');content.append(el('h2','Покрытие'));table(c.available?[c.coverage]:[]);content.append(el('h2','Какие данные запросить'));table(d.items);},
'Граница':async()=>{const d=await api('boundary');table(d.available?[d.counts]:[]);table(d.rates);},
'Аномалии':async()=>{const d=await api('anomalies');table(d.items);if(d.truncated)content.append(el('p','Показана часть; полный список в extras/anomalies.csv.'));},
'Карточка / маршруты':async()=>{const input=el('input');input.placeholder='GID узла';input.setAttribute('aria-label','GID');const b=el('button','Открыть');const area=el('div');b.onclick=async()=>{try{const d=await api('nodes/'+encodeURIComponent(input.value.trim())+'/card');area.replaceChildren(el('pre',d.text));const routes=await api('routes?gid='+encodeURIComponent(input.value.trim()));area.append(el('h3','Маршруты'),el('pre',JSON.stringify(routes.items,null,2)));}catch(e){error.textContent=e.message;}};content.append(input,b,area);}
};
for(const [name,fn] of Object.entries(screens)){const b=el('button',name);b.onclick=async()=>{content.replaceChildren();error.textContent='';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));try{await fn();}catch(e){error.textContent=e.message;}};document.querySelector('#tabs').append(b);}document.querySelector('nav button').click();
</script></html>
